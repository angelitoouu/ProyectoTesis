name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del Backend
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm install

      - name: Inyectar variables de entorno Backend
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          cp ~/backend.env ./backend/.env
          # Agregar o actualizar las credenciales SMTP en el .env
          grep -v "^SMTP_" ./backend/.env > ./backend/.env.tmp || true
          mv ./backend/.env.tmp ./backend/.env
          echo "SMTP_USER=${SMTP_USER}" >> ./backend/.env
          echo "SMTP_PASS=${SMTP_PASS}" >> ./backend/.env
          echo "SMTP_FROM=${SMTP_FROM:-$SMTP_USER}" >> ./backend/.env
          mkdir -p ./backend/src/config
          cp ./backend/.env ./backend/src/config/.env 2>/dev/null || true

      - name: Compilar Frontend
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm install
          npm run build

      - name: Reiniciar Backend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          setsid pm2 restart api-backend || setsid pm2 start server.js --name "api-backend"
          pm2 save
