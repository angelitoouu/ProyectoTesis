name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del Backend
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm install

      - name: Inyectar variables de entorno Backend
        run: |
          cp ~/backend.env ./backend/.env
          mkdir -p ./backend/src/config
          cp ~/backend.env ./backend/src/config/.env 2>/dev/null || true

      - name: Compilar Frontend
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm install
          npm run build

      - name: Reiniciar Backend con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          setsid pm2 restart api-backend || setsid pm2 start server.js --name "api-backend"
          pm2 save
